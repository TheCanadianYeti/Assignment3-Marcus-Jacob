<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spy App</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
            font-family: serif;
        }
        .container {
            width: 600px;
            background-color: #3b93c8;
            border: 2px solid black;
            text-align: center;
            padding: 20px 30px 40px 30px;
        }
        h1 { font-size: 26px; margin-bottom: 25px; }
        h2 { font-size: 18px; margin: 20px 0 10px 0; }
        .btn-link {
            display: inline-block;
            background-color: #efefef;
            color: black;
            text-decoration: none;
            padding: 2px 6px;
            border: 1px solid #767676;
            border-radius: 2px;
            font-size: 13px;
            font-family: sans-serif;
        }
        select, input[type="submit"] { font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Our Super Cool Spy App</h1>

    <h2>Create a Mission</h2>
    <a th:href="@{/createMission}" class="btn-link">Create a Mission</a>

    <h2>View Mission for:</h2>
    <form th:action="@{/viewMissions}" method="post">
        <select name="agent">
            <option th:each="agt : ${agents}" th:value="${agt}" th:text="${agt}"></option>
        </select>
        <input type="submit" value="Go!">
    </form>
</div>

</body>
</html>
